<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>PL Time Ticker</title>
  </head>
  <body>
    <center>
      <h1>บันทึกเวลาการทำของพนักงานขับรถประจำคลังพิษณุโลก</h1>
      <p>กดปุ่มด้านล่าง เพื่อบันทึกการลงเข้า</p>
      <button class="btn btn-success" onclick="getLocation('In')">Check-In</button>
      <p>กดปุ่ม เพื่อบันทึกเวลาออก</p>
      <button class="btn btn-danger" onclick="getLocation('Out')">Check-Out</button>
      <h2 style="color:red;">เมื่อเลิกงานแล้วอย่าลืม Check Out เพื่อสิทธิประโยชน์ของผู้ทำงานเอง</h2>

      <!-- ข้อมูลโปรไฟล์ -->
      <div id="profile" style="margin-top: 20px;">
        <h3>ข้อมูลผู้ใช้</h3>
        <img id="profilePicture" src="" alt="Profile Picture" width="100" style="border-radius: 50%; display: none;">
        <p id="displayName"></p>
        <p id="userId"></p>
      </div>

      <!-- Spinner สำหรับการโหลด -->
      <div id="loadingSpinner" class="spinner-border text-primary" style="display: none;" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </center>

    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      const xurl = "https://script.google.com/macros/s/AKfycbxWQaosFQWJihihsTsd0yyxnbzAsJ8KLEeqg7yxOq8FDz_V7CojFz7MECbsg8uvxqTOnw/exec";

      // เริ่มต้น LIFF
      window.onload = async () => {
        try {
          await liff.init({ liffId: '2006136313-6GEZ4b0D' });
          const profile = await liff.getProfile();
          displayProfile(profile);
        } catch (err) {
          console.error('LIFF Initialization failed', err);
        }
      };

      function displayProfile(profile) {
        document.getElementById("displayName").innerText = `👤 ชื่อผู้ใช้: ${profile.displayName}`;
        document.getElementById("userId").innerText = `🔑 User ID: ${profile.userId}`;
        if (profile.pictureUrl) {
          const profilePicture = document.getElementById("profilePicture");
          profilePicture.src = profile.pictureUrl;
          profilePicture.style.display = "block";
        }
      }

      async function getLocation(type) {
        // แสดง spinner ขณะรอข้อมูล
        document.getElementById('loadingSpinner').style.display = 'inline-block';

        if (!navigator.geolocation) {
          Swal.fire('❌ Error', 'Geolocation ไม่รองรับบนเบราว์เซอร์นี้', 'error');
          // ซ่อน spinner หากเกิดข้อผิดพลาด
          document.getElementById('loadingSpinner').style.display = 'none';
          return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
          const { latitude, longitude } = position.coords;
          try {
            const profile = await liff.getProfile();
            const xos = liff.getOS();
            const response = await fetch(`${xurl}?ctype=${type}&xos=${xos}&name=${profile.displayName}&userId=${profile.userId}&lat=${latitude}&long=${longitude}`);
            const jsonResponse = await response.json();

            const isError = jsonResponse.desc.includes("เกิน");
            await showAlertAndSendMessage(type, jsonResponse.desc, isError);
          } catch (err) {
            console.error('Error:', err);
            Swal.fire('❌ Error', 'ไม่สามารถดึงข้อมูลหรือบันทึกข้อมูลได้', 'error');
          } finally {
            // ซ่อน spinner เมื่อได้รับการตอบกลับ
            document.getElementById('loadingSpinner').style.display = 'none';
          }
        });
      }

      // ฟังก์ชันสำหรับแสดง SweetAlert และส่ง Flex Message
      async function showAlertAndSendMessage(type, message, isError) {
        const currentDate = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

        await Swal.fire({
          title: isError ? '❌ การดำเนินการไม่สำเร็จ' : '✅ ดำเนินการสำเร็จ',
          text: message,
          icon: isError ? 'error' : 'success',
          confirmButtonText: 'ตกลง'
        });

        const altText = isError ? 'ไม่สามารถบันทึกข้อมูลได้' : `${type === 'In' ? 'บันทึกเวลาเข้า' : 'บันทึกเวลาออก'}สำเร็จ`;

        await liff.sendMessages([{
          type: 'flex',
          altText: altText,
          contents: {
            type: 'bubble',
            size: 'mega',
            header: {
              type: 'box',
              layout: 'horizontal',
              contents: [{ type: 'text', text: altText, weight: 'bold', size: 'xl', color: '#ffffff' }],
              backgroundColor: isError ? '#dc3545' : '#28a745'
            },
            body: {
              type: 'box',
              layout: 'vertical',
              contents: [
                { type: 'text', text: message, color: '#333333', size: 'md', wrap: true },
                { type: 'text', text: `📅 วันที่: ${currentDate}`, color: '#666666', size: 'sm', margin: 'md' }
              ]
            }
          }
        }]);

        liff.closeWindow();
      }
    </script>
  </body>
</html>
